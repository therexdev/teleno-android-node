plugins { id 'com.android.application' }
android {
    namespace 'com.koinos.teleno'
    compileSdk 36
    defaultConfig {
        applicationId 'com.koinos.teleno.lite'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { jniLibs { useLegacyPackaging true; keepDebugSymbols += ['**/libteleno_node.so', '**/libteleno_runner.so', '**/libteleno_keys.so'] } }
    buildTypes { debug { debuggable false }; release { minifyEnabled false } }
}
